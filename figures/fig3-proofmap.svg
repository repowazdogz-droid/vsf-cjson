<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1080 370' width='1080' height='370' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif'><rect width='1080' height='370' fill='white'/><text x='30' y='24' font-size='14' fill='#1a1a1a' text-anchor='start' font-weight='600'>Figure 3 — What is proven, and what it rests on</text><rect x='30' y='60' width='190' height='54' rx='5' fill='none' stroke='#2b6cb0' stroke-width='1.5'/><text x='125' y='80' font-size='12' fill='#2b6cb0' text-anchor='middle' font-weight='600'>T1a  number round-trip</text><text x='125' y='98' font-size='10' fill='#6b6b6b' text-anchor='middle' font-weight='normal'>scanNumber ∘ renderNum = id</text><rect x='30' y='130' width='190' height='54' rx='5' fill='none' stroke='#2b6cb0' stroke-width='1.5'/><text x='125' y='150' font-size='12' fill='#2b6cb0' text-anchor='middle' font-weight='600'>T1b  string round-trip</text><text x='125' y='168' font-size='10' fill='#6b6b6b' text-anchor='middle' font-weight='normal'>escape ∘ unescape = id</text><rect x='30' y='200' width='190' height='54' rx='5' fill='none' stroke='#2b6cb0' stroke-width='1.5'/><text x='125' y='220' font-size='12' fill='#2b6cb0' text-anchor='middle' font-weight='600'>T2  canonicity</text><text x='125' y='238' font-size='10' fill='#6b6b6b' text-anchor='middle' font-weight='normal'>carried in the parser&#x27;s type</text><rect x='30' y='270' width='190' height='54' rx='5' fill='none' stroke='#2b6cb0' stroke-width='1.5'/><text x='125' y='290' font-size='12' fill='#2b6cb0' text-anchor='middle' font-weight='600'>T0  totality</text><text x='125' y='308' font-size='10' fill='#6b6b6b' text-anchor='middle' font-weight='normal'>no fuel; WF measure</text><rect x='280' y='130' width='190' height='54' rx='5' fill='none' stroke='#2b6cb0' stroke-width='1.5'/><text x='375' y='150' font-size='12' fill='#2b6cb0' text-anchor='middle' font-weight='600'>T1  round-trip</text><text x='375' y='168' font-size='10' fill='#6b6b6b' text-anchor='middle' font-weight='normal'>parse(serialize v) = v</text><rect x='530' y='165' width='210' height='62' rx='5' fill='none' stroke='#2f855a' stroke-width='1.5'/><text x='635' y='187' font-size='13' fill='#2f855a' text-anchor='middle' font-weight='700'>T3  IDEMPOTENCE</text><text x='635' y='205' font-size='10' fill='#6b6b6b' text-anchor='middle' font-weight='normal'>parse s = v  ⇒</text><text x='635' y='219' font-size='10' fill='#6b6b6b' text-anchor='middle' font-weight='normal'>parse(serialize v) = v</text><path d='M220 87 L280 150' stroke='#cbd5e0' stroke-width='1.4'/><circle cx='280' cy='150' r='2.5' fill='#cbd5e0'/><path d='M220 157 L280 157' stroke='#cbd5e0' stroke-width='1.4'/><circle cx='280' cy='157' r='2.5' fill='#cbd5e0'/><path d='M220 227 L280 165' stroke='#cbd5e0' stroke-width='1.4'/><circle cx='280' cy='165' r='2.5' fill='#cbd5e0'/><path d='M470 157 L530 185' stroke='#cbd5e0' stroke-width='1.4'/><circle cx='530' cy='185' r='2.5' fill='#cbd5e0'/><path d='M220 227 L530 200' stroke='#cbd5e0' stroke-width='1.4'/><circle cx='530' cy='200' r='2.5' fill='#cbd5e0'/><rect x='800' y='130' width='250' height='94' rx='5' fill='none' stroke='#c53030' stroke-width='1.5'/><text x='925' y='152' font-size='13' fill='#c53030' text-anchor='middle' font-weight='700'>GAP-2  NOT PROVEN</text><text x='925' y='172' font-size='10' fill='#6b6b6b' text-anchor='middle' font-weight='normal'>soundness vs. the SPEC grammar</text><text x='925' y='188' font-size='10' fill='#6b6b6b' text-anchor='middle' font-weight='normal'>= which inputs the parser ACCEPTS</text><text x='925' y='208' font-size='10' fill='#c53030' text-anchor='middle' font-weight='normal'>— most of SPEC.md — is MEASURED,</text><text x='925' y='220' font-size='10' fill='#c53030' text-anchor='middle' font-weight='normal'>not PROVEN.</text><path d='M745 196 L800 180' stroke='#c53030' stroke-width='1.2' stroke-dasharray='4 3'/><text x='770' y='250' font-size='10' fill='#6b6b6b' text-anchor='middle' font-weight='normal'>T1/T3 constrain what the serializer emits.
They say nothing about inputs it never produces.</text><text x='30' y='350' font-size='11' fill='#6b6b6b' text-anchor='start' font-weight='normal'>Trusted base: Lean kernel; propext + Classical.choice + Quot.sound; Lean&#x27;s compiler/runtime (GAP-EXTRACT); SPEC.md itself.</text></svg>