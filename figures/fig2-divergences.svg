t='normal'>INTENTIONAL_SEMANTIC_CHANGE</text><rect x='265' y='154' width='10.7' height='16' fill='#6b6b6b' opacity='0.85'/><text x='283.735' y='166' font-size='11' fill='#6b6b6b' text-anchor='start' font-weight='normal'>3,390  (2.83%)</text><text x='760' y='166' font-size='11' fill='#6b6b6b' text-anchor='start' font-weight='normal'>divergences approved in SPEC S6</text><text x='30' y='194' font-size='12' fill='#1a1a1a' text-anchor='start' font-weight='normal'>HARNESS_ERROR</text><rect x='265' y='182' width='1.5' height='16' fill='#1a1a1a' opacity='0.85'/><text x='274.5' y='194' font-size='11' fill='#6b6b6b' text-anchor='start' font-weight='normal'>22  (0.02%)</text><text x='760' y='194' font-size='11' fill='#1a1a1a' text-anchor='start' font-weight='normal'>OUR comparator could not decide (not either binary)</text><text x='30' y='222' font-size='12' fill='#1a1a1a' text-anchor='start' font-weight='normal'>UNCLASSIFIED</text><rect x='265' y='210' width='1.5' height='16' fill='#c53030' opacity='0.85'/><text x='274.5' y='222' font-size='11' fill='#6b6b6b' text-anchor='start' font-weight='normal'>0  (0.00%)</text><text x='760' y='222' font-size='11' fill='#c53030' text-anchor='start' font-weight='normal'>no rule matched - a finding if nonzero</text><line x1='265' y1='238' x2='645' y2='238' stroke='#cbd5e0'/><text x='265' y='254' font-size='10' fill='#6b6b6b' text-anchor='start' font-weight='normal'>0</text><text x='645' y='254' font-size='10' fill='#6b6b6b' text-anchor='end' font-weight='normal'>120,000</text></svg>