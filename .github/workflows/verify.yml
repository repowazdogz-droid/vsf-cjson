name: verify

# Runs the FULL release verification and the mutation suite in public CI.
#
# HONEST NOTE ON THE v1.0.1 TAG: the `v*` trigger below cannot fire for v1.0.1 itself.
# The v1.0.1 commit predates this workflow, and the tag must not be moved. So for this
# release, CI runs on `main` — whose tree is identical to v1.0.1 apart from this file —
# and the job PROVES that with an explicit `git diff` assertion (step "tree matches the
# release tag"). The `v*` trigger is live for all subsequent tags.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: checkout (full history, so tags are available)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: tree matches the release tag (outside .github/)
        run: |
          set -euo pipefail
          if git rev-parse -q --verify refs/tags/v1.0.1 >/dev/null; then
            if git diff --quiet v1.0.1 HEAD -- . ':(exclude).github'; then
              echo "OK: verified tree is byte-identical to v1.0.1 outside .github/"
            else
              echo "NOTE: tree differs from v1.0.1 outside .github/ (expected on later commits/PRs):"
              git diff --stat v1.0.1 HEAD -- . ':(exclude).github'
            fi
          fi

      - name: install the pinned Lean toolchain (from lean/lean-toolchain)
        run: |
          set -euo pipefail
          # download OUTSIDE the workspace: the clean-tree gate (correctly) fails on any
          # stray file, and it caught this.
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/v3.1.1/elan-init.sh \
            -o "$RUNNER_TEMP/elan-init.sh"
          sha256sum "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: show toolchain (must match release/manifest.json)
        # NB: run from lean/, which is where lean-toolchain lives; elan resolves the
        # pinned toolchain from the directory, and there is no default toolchain set.
        run: |
          set -euo pipefail
          cat lean/lean-toolchain
          elan toolchain install "$(cat lean/lean-toolchain)"
          ( cd lean && lean --version && lake --version )

      - name: build every proof module from a clean state
        run: |
          set -euo pipefail
          rm -rf lean/.lake
          ( cd lean && lake build )

      - name: full release verification (16 gates)
        run: ./verify.sh

      - name: mutation suite (20 attacks; every gate must FAIL)
        run: ./harness/mutation_tests.sh

      - name: working tree must be clean
        run: |
          set -euo pipefail
          git status --porcelain
          test -z "$(git status --porcelain)" || { echo "TREE DIRTY"; exit 1; }
          echo "OK: tree clean after verification and mutation suite"
